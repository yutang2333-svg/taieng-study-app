<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#126b5e" />
    <title>正在更新泰英口语教练</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f5ee;color:#193734;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      main{max-width:300px;text-align:center;padding:32px}h1{font-size:23px;margin:0 0 10px}p{line-height:1.65;color:#61736f;margin:0}.dot{width:42px;height:42px;border:4px solid #dcefe9;border-top-color:#126b5e;border-radius:50%;margin:0 auto 22px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>正在更新课程</h1>
      <p id="message">请稍候，正在清除旧缓存。</p>
    </main>
    <script>
      (async () => {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          document.getElementById('message').textContent = '更新完成，正在打开新版课程。';
          setTimeout(() => location.replace('./?updated=4'), 600);
        } catch (error) {
          document.getElementById('message').textContent = '请关闭网页后重新打开此链接。';
        }
      })();
    </script>
  </body>
</html>
